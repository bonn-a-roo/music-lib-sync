# Copy this file to config.ini and fill in your values
# config.ini should NOT be committed to version control

[Settings]
# Directory where music files will be downloaded
download_path = ~/Music/downloads

# Optional: Path to cookies.txt for authenticated downloads
# Leave empty if not needed
cookies_file =

[Spotify]
# Spotify app credentials
# Get these from: https://developer.spotify.com/dashboard
client_id = your_client_id_here
client_secret = your_client_secret_here

# Redirect URI (must match what's set in Spotify dashboard)
redirect_uri = http://localhost
